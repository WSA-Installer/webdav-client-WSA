name: Build and Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            zig_target: x86_64-linux-musl
            asset: webdavfs-x86_64
          - target: aarch64
            zig_target: aarch64-linux-musl
            asset: webdavfs-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Fetch mbedTLS sources
        env:
          MBEDTLS_VERSION: 3.6.7
        run: |
          set -eu
          curl -fsSL "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-${MBEDTLS_VERSION}/mbedtls-${MBEDTLS_VERSION}.tar.bz2" -o /tmp/mbedtls.tar.bz2
          tar -xjf /tmp/mbedtls.tar.bz2 -C /tmp
      - name: Compile static binary
        env:
          ZIG_TARGET: ${{ matrix.zig_target }}
          ASSET: ${{ matrix.asset }}
          MBEDTLS_VERSION: 3.6.7
        run: |
          set -eu
          mkdir -p dist
          MBEDTLS="/tmp/mbedtls-${MBEDTLS_VERSION}/library"
          # Disable MBEDTLS_DEBUG_C so we don't depend on the generated
          # ssl_debug_helpers.c (framework tooling); unused for our threat
          # model (loopback HTTP, optional TLS).
          echo '#undef MBEDTLS_DEBUG_C' > "/tmp/mbedtls-${MBEDTLS_VERSION}/include/mbedtls/mbedtls_user_config.h"
          # Compile webdavfs.c together with every mbedTLS library source in
          # a single zig cc invocation — no archive/object handoff, so the
          # linker cannot drop the TLS code.
          mapfile -t MBEDTLS_SRC < <(find "$MBEDTLS" -maxdepth 1 -name '*.c' | sort)
          echo "mbedTLS sources: ${#MBEDTLS_SRC[@]}"
          zig cc -target "$ZIG_TARGET" -Os -static -s \
            -DVERSION='"0.2.0"' -DWEBDAVFS_WITH_TLS=1 \
            -DMBEDTLS_USER_CONFIG_FILE='"mbedtls/mbedtls_user_config.h"' \
            -Wall -Wextra \
            -I "/tmp/mbedtls-${MBEDTLS_VERSION}/include" \
            -I "$MBEDTLS" \
            src/webdavfs.c "${MBEDTLS_SRC[@]}" \
            -o "dist/$ASSET"
          file "dist/$ASSET"
          chmod 755 "dist/$ASSET"
          SIZE=$(stat -c %s "dist/$ASSET")
          echo "binary size: $SIZE bytes"
          if [ "$SIZE" -lt 200000 ]; then
            echo "binary suspiciously small - mbedTLS likely not linked" >&2
            exit 1
          fi
          strings "dist/$ASSET" | grep -q mbedtls
      - name: Install QEMU (for aarch64 smoke on x86_64 host)
        if: matrix.target == 'aarch64'
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          qemu-aarch64-static --version | head -n 1
      - name: Smoke test
        env:
          ASSET: ${{ matrix.asset }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          RUN=""
          if [ "$TARGET" = "aarch64" ]; then RUN="qemu-aarch64-static"; fi
          $RUN "dist/$ASSET" --version | grep -q webdavfs
          $RUN "dist/$ASSET" --selftest
          $RUN "dist/$ASSET" --help >/dev/null
          # Graceful failure: nonexistent mountpoint must be rejected before any mount.
          if $RUN "dist/$ASSET" http://127.0.0.1:8085/c/ /nonexistent >/tmp/out 2>&1; then
            echo "unexpected mount success" >&2
            exit 1
          fi
          grep -Eq 'not a directory|cannot open /dev/fuse|mount failed' /tmp/out
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  package:
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/native
          merge-multiple: true
      - name: Assemble release assets
        run: |
          set -eu
          mkdir -p dist/payload
          cp dist/native/webdavfs-x86_64 dist/payload/
          cp dist/native/webdavfs-aarch64 dist/payload/
          cp scripts/webdavfs.sh dist/webdavfs.sh
          chmod 755 dist/webdavfs.sh
          cat > dist/webdavfs-universal <<'LAUNCHER'
          #!/bin/sh
          set -eu
          SELF="$0"
          TMP="${TMPDIR:-/tmp}/webdavfs-universal.$$"
          mkdir -p "$TMP"
          trap 'rm -rf "$TMP"' EXIT HUP INT TERM
          line=$(awk '$0=="__WEBDAVFS_PAYLOAD_BELOW__" {print NR+1; exit}' "$SELF")
          [ -n "$line" ] || { echo "webdavfs-universal: payload missing" >&2; exit 1; }
          tail -n +"$line" "$SELF" | tar -xz -C "$TMP"
          case "$(uname -m)" in
            x86_64|amd64) BIN="$TMP/webdavfs-x86_64" ;;
            aarch64|arm64) BIN="$TMP/webdavfs-aarch64" ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 126 ;;
          esac
          chmod 755 "$BIN"
          exec "$BIN" "$@"
          LAUNCHER
          printf '%s\n' '__WEBDAVFS_PAYLOAD_BELOW__' >> dist/webdavfs-universal
          tar -czf dist/payload.tar.gz -C dist/payload .
          cat dist/payload.tar.gz >> dist/webdavfs-universal
          chmod 755 dist/webdavfs-universal
          cp dist/native/webdavfs-x86_64 dist/
          cp dist/native/webdavfs-aarch64 dist/
          sh -n dist/webdavfs.sh
          for f in webdavfs.sh webdavfs-x86_64 webdavfs-aarch64 webdavfs-universal; do test -s "dist/$f"; done
          # Universal launcher smoke (host is x86_64; verifies self-extract + dispatch).
          dist/webdavfs-universal --version | grep -q webdavfs
          dist/webdavfs-universal --selftest
          ls -lh dist/webdavfs*
      - uses: actions/upload-artifact@v4
        with:
          name: webdavfs-release-assets
          path: |
            dist/webdavfs.sh
            dist/webdavfs-x86_64
            dist/webdavfs-aarch64
            dist/webdavfs-universal
          if-no-files-found: error
      - name: Publish development prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "WebDAV Client WSA ${{ github.ref_name }}"
          body: |
            Full read-write WebDAV FUSE client with static mbedTLS, plus the boot-time drive reconciler script.
            Mounts registry drives at `/data/media/0/<label>` (loopback via `adb reverse tcp:8085 tcp:8085` only).
            Smoke-tested in CI (`--selftest`, graceful mount rejection); on-device behavior still requires manual testing.
          files: |
            dist/webdavfs.sh
            dist/webdavfs-x86_64
            dist/webdavfs-aarch64
            dist/webdavfs-universal
